name: Build Docker images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  elementum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Elementum version
        id: version
        run: |
          version=$(grep -oP '(?<=ELEMENTUM_VERSION=)[0-9.]+' elementum/Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: elementum
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/elementum:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/elementum:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
